name: Generate JSDoc

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'jsdoc.json'
      - '.github/workflows/jsdoc.yml'

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate JSDoc
        run: npm run docs # See docs command in package.json

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Commit and push generated docs
        run: |
          git config user.name "JSDocs Bot"
          git config user.email "TrojanHorsesBot@no-reply.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "JSDocs Auto Generated Documentation"
          git push
