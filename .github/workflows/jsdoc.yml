name: Auto-generate JSDoc

on:
  push:
    branches: [main]
    paths:
      - '**.js'
      - 'jsdocs.js'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies (if any)
        run: npm install || true  # will skip silently if no package.json

      - name: Run Custom JSDoc Generator
        run: node jsdocs.js

      - name: Commit & Push Docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "📝 Auto-generated custom docs"
          git push
