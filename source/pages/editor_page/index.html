<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Editor Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" type="application/javascript" defer></script>
    <script src="tool-bar-func.js" type="application/javascript" defer></script>
    <script src="top-bar-func.js" type="application/javascript" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  </head>
  <body>
    <main>
        <div class="pagetop">
            <!-- Toolbar buttons can go here -->
            <div class="topsquare"></div>
            <button class="flip" onclick="alert('Flip clicked!')">Flip Card</button>
            <div class="cardFront"></div>
        </div>

        <div class="featurebar">
          <!-- Color Picker UI -->
          <div class="toolbar-section">
            <div id="color-circle" title="Pick a background color"></div>
            <input type="color" id="color-picker" style="display: none;">
          </div>
        </div>
    </main>
  </body>
</html>
